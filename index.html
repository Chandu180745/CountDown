<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>A New Beginning — Saveri Infra</title>
<style>
:root{--beige:#efe6d6;--beige2:#e4d6bd;--tan:#b39a6b;--navy:#0f1f3d;--navy2:#23407a;--off:#faf6ee;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--ease:cubic-bezier(.22,.8,.2,1);--a:0;--e:0;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--beige);color:var(--navy);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--off) 0,var(--beige) 55%,var(--beige2) 100%)}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.5;will-change:transform}
.b1{left:-25vmax;top:-20vmax;background:radial-gradient(circle,rgba(15,31,61,.16),transparent 65%);animation:drift 26s ease-in-out infinite alternate}
.b2{right:-28vmax;bottom:-28vmax;background:radial-gradient(circle,rgba(179,154,107,.4),transparent 65%);animation:drift 32s ease-in-out infinite alternate-reverse}
.frame{position:fixed;inset:max(16px,env(safe-area-inset-top,0px)) 16px 16px;border:1px solid rgba(15,31,61,.14);z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.scene{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(36px + env(safe-area-inset-top,0px)) 28px calc(36px + env(safe-area-inset-bottom,0px));z-index:1}
.scene.on{display:flex}
#cele{z-index:4}
.logo{display:block;width:min(82vw,640px);height:auto;user-select:none;-webkit-user-drag:none}
.sm{width:min(52vw,230px)}
.tag{font-size:clamp(.72rem,2.3vw,.9rem);letter-spacing:.38em;text-transform:uppercase;margin:clamp(28px,6vh,52px) 0 clamp(26px,5vh,44px);color:var(--navy);opacity:.78;padding-left:.38em}
.btn{font:600 .85rem/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--navy);background:var(--navy);color:var(--beige);padding:20px 38px;min-height:56px;border-radius:999px;cursor:pointer;transition:transform .35s var(--ease),background .35s,color .35s,box-shadow .35s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(15,31,61,.6)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:var(--navy);color:var(--beige)}
.txt{font:500 .72rem/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;background:none;border:0;color:var(--navy);opacity:.55;cursor:pointer;padding:16px 18px;min-height:48px}
.txt:hover{opacity:1}
:focus-visible{outline:2px solid var(--navy2);outline-offset:4px;border-radius:6px}
.btn:focus-visible{outline-offset:5px;border-radius:999px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* intro */
#intro .logo,#intro .tag,#intro .btn{opacity:0}
#intro.play .logo{animation:logoIn 1.5s var(--ease) .1s forwards}
#intro.play .tag{animation:rise 1.1s var(--ease) 1s forwards}
#intro.play .btn{animation:rise 1.1s var(--ease) 1.4s forwards}
/* countdown */
#count{justify-content:space-between}
#count .logo{opacity:.92}
.timer{position:relative;width:min(80vw,46vh,400px);aspect-ratio:1;display:grid;place-items:center;margin:2vh 0}
.orbits{position:absolute;inset:0;pointer-events:none}
.rg{position:absolute;border-radius:50%;border:1px solid rgba(15,31,61,.2);opacity:calc(.25 + var(--e)*.75)}
.rg::after{content:"";position:absolute;left:50%;top:-4px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--navy)}
.r1{inset:-6%;transform:rotate(calc(var(--a)*1deg))}
.r2{inset:-17%;border-style:dashed;transform:rotate(calc(var(--a)*-1.5deg))}.r2::after{background:var(--tan)}
.r3{inset:-30%;transform:rotate(calc(var(--a)*2.3deg));opacity:calc(var(--e)*.8)}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none}
.tk{stroke:rgba(15,31,61,.35);stroke-width:5;stroke-dasharray:1 9.4}
.tr{stroke:rgba(15,31,61,.1);stroke-width:1.2}
.pr{stroke:var(--navy);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:590.6;stroke-dashoffset:0}
.time{position:relative;font:400 clamp(3.2rem,15vw,5.4rem)/1 var(--serif);font-variant-numeric:tabular-nums lining-nums;letter-spacing:.01em;text-align:center}
.time.digit{font-size:clamp(7rem,32vw,11rem);font-weight:500}
.time.beat{animation:beat .95s var(--ease)}
.lab{font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;opacity:.65;min-height:1em;padding-left:.34em}
.pulse{position:absolute;inset:6%;border-radius:50%;border:1.5px solid var(--navy);opacity:0;animation:pulse 1.1s var(--ease) forwards;pointer-events:none}
.sweep{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent 35%,rgba(250,246,238,.75) 50%,transparent 65%);transform:translateX(-100%)}
.sweep.go{animation:sweep .9s ease-in-out}
/* wipes */
.disc{position:fixed;left:50%;top:50%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;border-radius:50%;transform:scale(0);z-index:2;pointer-events:none;display:none;transition:transform 1s cubic-bezier(.7,0,.25,1)}
#d1{background:var(--navy)}#d2{background:var(--beige);z-index:3}
.disc.on{display:block}.disc.go{transform:scale(1)}
/* celebration */
#cele .logo{width:min(80vw,600px);opacity:0}
#cele.s-logo .logo{animation:logoIn 1.6s var(--ease) forwards}
h1{font:400 clamp(2.5rem,8.6vw,6rem)/1.06 var(--serif);letter-spacing:-.015em;margin:clamp(24px,5vh,46px) 0 0;max-width:15ch;min-height:2.1em;color:var(--navy)}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;opacity:0;transform:translateY(60%) rotate(4deg);filter:blur(6px)}
#cele.s-msg .l{animation:letter 1s var(--ease) forwards;animation-delay:calc(var(--i)*42ms)}
.rule{width:min(240px,50vw);height:1px;background:var(--tan);margin:clamp(18px,3.5vh,30px) auto 0;transform:scaleX(0);transition:transform 1.2s var(--ease)}
#cele.s-link .rule{transform:scaleX(1)}
.lk{margin:clamp(10px,2vh,18px) 0 0;opacity:0;transform:translateY(16px)}
.lk.show{opacity:1;transform:none;transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.lk a{display:inline-flex;align-items:center;min-height:52px;padding:10px 20px;font:600 clamp(1rem,3.6vw,1.3rem)/1 var(--sans);letter-spacing:.14em;color:var(--navy);text-decoration:none;background:linear-gradient(var(--navy),var(--navy)) 20px calc(100% - 12px)/0 1.5px no-repeat;transition:background-size .5s var(--ease),color .3s}
.lk a:hover,.lk a:focus-visible{background-size:calc(100% - 40px) 1.5px;color:var(--navy2)}
.again{margin-top:clamp(14px,3vh,26px);opacity:0;transition:opacity 1s}
.again.show{opacity:1}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:scale(.94) translateY(14px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes beat{0%{transform:scale(var(--amp,1.3));opacity:0}22%{opacity:1}100%{transform:scale(1)}}
@keyframes pulse{from{transform:scale(.55);opacity:.55}to{transform:scale(2.3);opacity:0}}
@keyframes sweep{0%{opacity:1;transform:translateX(-100%)}100%{opacity:1;transform:translateX(100%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-height:640px){.sm{width:150px}.tag{margin:18px 0}}
@media (prefers-reduced-motion:reduce){
.blob,.orbits,.sweep,.pulse,.disc,#fx{display:none!important}
#intro.play .logo,#intro.play .tag,#intro.play .btn,#cele.s-logo .logo{animation:fade .8s ease forwards;animation-delay:0s}
#intro.play .tag{animation-delay:.3s}#intro.play .btn{animation-delay:.5s}
.l{transform:none;filter:none}
#cele.s-msg .l{animation:fade .9s ease forwards;animation-delay:0s}
.time.beat{animation:fade .5s ease}
.rule{transition:none}.lk.show{transition:opacity .9s;transform:none}
.btn:hover{transform:none}
}
</style>
</head>

 msg.appendChild(s);if(wi<arr.length-1){msg.appendChild(document.createTextNode(" "));LN+=2}});

/* canvas fx */
const cv=$("#fx"),cx=cv.getContext("2d");let W=0,H=0,dpr=1;
function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",size);size();
const R=Math.random,NAVY="15,31,61",TAN="168,140,90";
const AMB=Array.from({length:90},()=>({x:R(),y:R(),r:1+R()*2.2,vx:(R()-.5)*.02,vy:(R()-.5)*.02,s:(R()*3)|0,c:R()<.55?NAVY:TAN,a:.2+R()*.3,ph:R()*6.28,rot:R()*6.28}));
const ORB=Array.from({length:30},(_,i)=>({ang:R()*6.28,rr:.62+R()*.75,sp:(.25+R()*.75)*(i%2?-1:1),r:1.5+R()*2.2,c:i%3?NAVY:TAN,a:.35+R()*.4}));
let BURST=[],cur=.15,lvl=.15,prog=0,lastT=performance.now();
function shape(p,r,rot){cx.save();cx.translate(p.x,p.y);cx.rotate(rot||0);
 if(p.s===0){cx.beginPath();cx.arc(0,0,r,0,6.283);cx.fill()}
 else if(p.s===1){cx.fillRect(-r,-r,r*2,r*2)}
 else{cx.fillRect(-r*3,-.5,r*6,1)}cx.restore()}
function burst(n,x,y,pw){const cols=[NAVY,NAVY,"35,64,122",TAN,"196,164,106","250,246,238"];
 for(let i=0;i<n;i++){const a=R()*6.283,v=(.35+R()*.65)*pw;BURST.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:3+R()*6,h:5+R()*9,rot:R()*6.28,vr:(R()-.5)*8,fl:R()*6,c:cols[(R()*cols.length)|0],life:2.4+R()*1.8,max:0,s:R()<.3?0:R()<.5?1:2,g:140})}
 BURST.forEach(p=>p.max=p.life)}
function rain(n){const cols=[NAVY,"35,64,122",TAN,"196,164,106"];
 for(let i=0;i<n;i++)BURST.push({x:R()*W,y:-20-R()*H*.3,vx:(R()-.5)*30,vy:40+R()*60,w:3+R()*4,h:6+R()*8,rot:R()*6.28,vr:(R()-.5)*4,fl:R()*6,c:cols[(R()*cols.length)|0],life:6+R()*3,max:0,s:1,g:12,rain:1});
 BURST.forEach(p=>{if(!p.max)p.max=p.life})}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastT)/1e3);lastT=now;
 cx.clearRect(0,0,W,H);if(RM())return;
 cur+=(lvl-cur)*Math.min(1,dt*2);
 const n=Math.floor(AMB.length*(.3+.7*cur)),sp=.5+3*cur,tt=now/1e3;
 for(let i=0;i<n;i++){const p=AMB[i];p.x+=p.vx*sp*dt;p.y+=p.vy*sp*dt;p.rot+=dt*.3;
  if(p.x<-.02)p.x=1.02;if(p.x>1.02)p.x=-.02;if(p.y<-.02)p.y=1.02;if(p.y>1.02)p.y=-.02;
  cx.fillStyle=`rgba(${p.c},${p.a*(.6+.4*Math.sin(tt+p.ph))})`;shape({x:p.x*W,y:p.y*H,s:p.s},p.r,p.rot)}
 if(state==="count"){
  orbA+=dt*(4+60*prog*prog+(lastSecs>0&&lastSecs<=10?90:0));
  orbits.style.setProperty("--a",orbA.toFixed(1));
  const k=lastSecs>0&&lastSecs<=10?1:clamp((prog-.12)/.55,0,1),m=Math.floor(ORB.length*k);
  const b=timer.getBoundingClientRect(),ox=b.left+b.width/2,oy=b.top+b.height/2,rad=b.width/2;
  for(let i=0;i<m;i++){const o=ORB[i];o.ang+=o.sp*dt*(.3+2.4*cur);const rr=rad*o.rr;
   cx.fillStyle=`rgba(${o.c},${o.a})`;cx.beginPath();cx.arc(ox+Math.cos(o.ang)*rr,oy+Math.sin(o.ang)*rr,o.r,0,6.283);cx.fill()}}
 for(let i=BURST.length-1;i>=0;i--){const p=BURST[i];p.life-=dt;if(p.life<=0||p.y>H+40){BURST.splice(i,1);continue}
  const d=p.rain?1:Math.pow(.2,dt);p.vx*=d;p.vy=p.vy*d+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.fl+=dt*5;
  const al=Math.min(1,p.life/(p.max*.35));cx.fillStyle=`rgba(${p.c},${al})`;
  if(p.s===0){cx.beginPath();cx.arc(p.x,p.y,p.w/2,0,6.283);cx.fill()}
  else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.fl)),p.w,p.h*Math.abs(Math.cos(p.fl)));cx.restore()}}
}
requestAnimationFrame(loop);

/* countdown */
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function beat(s){
 timeEl.classList.remove("beat");timeEl.style.setProperty("--amp",s<=3?[0,2.6,2.1,1.75][s]:1.3);reflow(timeEl);timeEl.classList.add("beat");
 const n=s<=3?4-s:1;for(let i=0;i<n;i++)later(()=>{const p=document.createElement("div");p.className="pulse";timer.appendChild(p);setTimeout(()=>p.remove(),1300)},i*140);
 if(s<=3){sweep.classList.remove("go");reflow(sweep);sweep.classList.add("go")}
}
function tick(){
 if(state!=="count")return;
 const el=performance.now()-t0,rem=Math.max(0,D-el),secs=Math.ceil(rem/1000);prog=clamp(el/D,0,1);
 pr.style.strokeDashoffset=(C*prog).toFixed(2);
 const ph=secs<=10?3:el<60000?1:2;
 if(app.dataset.phase!=ph){app.dataset.phase=ph;lab.textContent=["","Anticipation","Momentum","The final moments"][ph]}
 app.style.setProperty("--e",ph===3?1:(prog*.9).toFixed(3));lvl=ph===3?1:.15+prog*.8;
 if(secs!==lastSecs){lastSecs=secs;
  if(secs>0&&secs<=10){timeEl.classList.add("digit");timeEl.textContent=secs;if(!RM())beat(secs);else timeEl.classList.add("beat")}
  else{timeEl.classList.remove("digit","beat");timeEl.textContent=fmt(secs)}
  if(secs===10)say("Ten seconds");}
 if(rem<=0)finish();}
function begin(){
 if(state!=="intro")return;state="count";lastSecs=-1;prog=0;orbA=0;
 intro.classList.remove("on","play");count.classList.add("on");
 timeEl.textContent="3:00";pr.style.strokeDashoffset=0;app.dataset.phase=1;lab.textContent="Anticipation";
 say("Countdown started. Three minutes.");$("#cancel").focus({preventScroll:true});
 t0=performance.now();tick();iv=setInterval(tick,200);
 (function f(){if(state==="count"){tick();requestAnimationFrame(f)}})();}
function finish(){
 if(state!=="count")return;state="finale";clearInterval(iv);
 timeEl.classList.remove("digit","beat");timeEl.textContent="00:00";pr.style.strokeDashoffset=C;lvl=1;say("Zero.");
 const rm=RM(),P=rm?500:900;
 later(()=>{
  if(!rm){d1.classList.add("on");reflow(d1);d1.classList.add("go")}
  later(()=>{count.classList.remove("on");cele.classList.add("on");state="cele";lvl=.4;
   if(!rm){d2.classList.add("on");reflow(d2);d2.classList.add("go");later(()=>burst(140,W/2,H/2,Math.max(W,H)*.75),250)}
   later(()=>cele.classList.add("s-logo"),rm?100:700);
   const tm=rm?900:1700,dur=rm?900:LN*42+1000;
   later(()=>{cele.classList.add("s-msg");say(TEXT)},tm);
   later(()=>{lk.hidden=false;reflow(lk);lk.classList.add("show");cele.classList.add("s-link");if(!rm)rain(45)},tm+dur+350);
   later(()=>{d1.classList.remove("on","go");d2.classList.remove("on","go")},3500);
  },rm?0:850);
 },P);}
function reset(){
 TO.forEach(clearTimeout);TO=[];clearInterval(iv);state="intro";BURST=[];lvl=.15;lastSecs=-1;prog=0;
 cele.classList.remove("on","s-logo","s-msg","s-link");lk.classList.remove("show");lk.hidden=true;
 [d1,d2].forEach(d=>d.classList.remove("on","go"));sweep.classList.remove("go");
 timer.querySelectorAll(".pulse").forEach(p=>p.remove());
 timeEl.classList.remove("digit","beat");timeEl.textContent="3:00";pr.style.strokeDashoffset=0;app.dataset.phase=1;app.style.setProperty("--e",0);
 count.classList.remove("on");intro.classList.remove("play");intro.classList.add("on");reflow(intro);intro.classList.add("play");
 $("#start").focus({preventScroll:true});}
$("#start").addEventListener("click",begin);
$("#cancel").addEventListener("click",reset);
})();
</script>
</body>
